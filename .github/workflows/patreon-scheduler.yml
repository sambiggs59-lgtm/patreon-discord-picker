name: Weekly Patreon Discord Picker

on:
  repository_dispatch:
    types: [trigger-weekly-picker]
  workflow_dispatch: # Keeps a manual "Run workflow" button in GitHub for testing

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run picker script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # Adjust to match your exact secret name
        run: python weekly_picker.py

      - name: Commit and push updated used_links.json
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add used_links.json
          # Only commit and push if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of used_links.json [skip ci]" && git push)
