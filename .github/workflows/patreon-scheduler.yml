name: Patreon Scheduler Test

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm execution
        run: |
          echo "Scheduled workflow is alive!"
          echo "Event: ${{ github.event_name }}"
          date -u
